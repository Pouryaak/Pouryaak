<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 64" width="100%" height="64" fill="none">
  <defs>
    <style type="text/css"><![CDATA[
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .ghpx-root {
        width: 880px;
        height: 64px;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        position: relative;
      }
      .mono {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace;
      }
      
      .sh-cup {
        width: 100%; height: 100%; padding: 0 4px;
        display: flex; justify-content: space-between; align-items: flex-end;
        padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08);
      }
    
    ]]></style>
    
  </defs>
  <rect width="880" height="64" fill="transparent"/>
  <foreignObject x="0" y="0" width="880" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" class="ghpx-root">
      
      <div class="sh-cup">
        <span style="font-size:22px; font-weight:700; color:#f5f5f7; letter-spacing:-0.5px;">Experience &amp; Leadership</span>
        <span style="font-size:12.5px; color:#86868b;">Production track record &amp; open-source contributions</span>
      </div>
    
    </div>
  </foreignObject>
  
</svg>