<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="100%" height="190" fill="none">
  <defs>
    <style type="text/css"><![CDATA[
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .ghpx-root {
        width: 880px;
        height: 190px;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        position: relative;
      }
      .mono {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace;
      }
      .ph-dark { width:100%; height:100%; display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
    ]]></style>
    
  </defs>
  <rect width="880" height="190" fill="transparent"/>
