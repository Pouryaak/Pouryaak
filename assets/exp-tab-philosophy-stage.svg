        <div style="font-size:15.5px; font-weight:700; color:#f5f5f7; margin-top:7px;">Anthropic AI Fluency &amp; AWS Certified</div>
        <div style="font-size:12px; color:#86868b; line-height:1.55; margin-top:8px;">Combining cloud architecture with client-side WebGPU AI and WCAG 2.1 AA accessibility standards.</div>
