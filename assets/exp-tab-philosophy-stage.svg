        <div style="font-size:15.5px; font-weight:700; color:#f5f5f7; margin-top:7px;">Instructor @ HackYourFuture Denmark</div>
        <div style="font-size:12px; color:#86868b; line-height:1.55; margin-top:8px;">Taught JavaScript and React for 2 years to help underserved talent transition into engineering careers.</div>
