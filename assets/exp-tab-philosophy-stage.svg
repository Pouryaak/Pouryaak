        <div style="font-size:15.5px; font-weight:700; color:#f5f5f7; margin-top:7px;">Contributor to Bolt.diy &amp; Dyad</div>
        <div style="font-size:12px; color:#86868b; line-height:1.55; margin-top:8px;">Shipping UX improvements and architectural fixes to leading open-source AI app builders.</div>
      </div>
      <div style="background:#0d0d10; border:1px solid rgba(255,255,255,0.08); border-radius:18px; padding:20px;">
