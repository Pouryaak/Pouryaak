<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="380" fill="none">
  <defs>
    <style type="text/css"><![CDATA[
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .ghpx-root {
        width: 880px;
        height: 380px;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        position: relative;
      }
      .mono {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace;
      }
      
      .cup-hero {
        width: 100%;
        height: 100%;
        padding: 44px 64px 38px 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        text-align: center;
      }
      .cup-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        padding: 5px 14px;
        font-size: 11px;
        font-weight: 500;
        color: #f5f5f7;
        letter-spacing: 0.2px;
      }
      .cup-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #2997ff;
      }
      .cup-headline {
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -1.8px;
        line-height: 1.04;
        color: #f5f5f7;
        margin-top: 16px;
      }
      .cup-sub {
        font-size: 19px;
        font-weight: 400;
        color: #86868b;
        letter-spacing: -0.2px;
        margin-top: 10px;
        max-width: 620px;
        line-height: 1.4;
      }
    
    ]]></style>
    
      <radialGradient id="cupertinoStudioLight" cx="50%" cy="0%" r="70%">
        <stop offset="0%" stop-color="#2997ff" stop-opacity="0.15"/>
        <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="cupertinoBorder" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
      </linearGradient>
    
  </defs>
  
      <rect width="880" height="380" rx="24" fill="#000000"/>
      <rect width="880" height="380" rx="24" fill="url(#cupertinoStudioLight)"/>
      <rect x="0.75" y="0.75" width="878.5" height="378.5" rx="23.25" stroke="url(#cupertinoBorder)" stroke-width="1.5" fill="none"/>
    
  <foreignObject x="0" y="0" width="880" height="380">
    <div xmlns="http://www.w3.org/1999/xhtml" class="ghpx-root">
      
      <div class="cup-hero">
        <div>
          <div class="cup-pill">
            <span class="cup-dot"></span>
            <span>Copenhagen, Denmark  ·  pourya.space</span>
          </div>
          <div class="cup-headline">Pourya Akrami.</div>
          <div class="cup-sub">Senior Frontend Architect &amp; Browser-Native AI Engineer</div>
        </div>

        <div style="display:flex; justify-content:center; align-items:center; padding-top:24px; border-top:1px solid rgba(255,255,255,0.08); width:100%;">
          
      <div style="padding: 0 32px;  text-align: center;">
        <div style="font-size: 28px; font-weight: 700; color: #f5f5f7; letter-spacing: -0.8px;">8+ Years</div>
        <div style="font-size: 12px; font-weight: 500; color: #86868b; margin-top: 4px;">Frontend Architecture</div>
      </div>
      <div style="padding: 0 32px; border-left: 1px solid rgba(255,255,255,0.1); text-align: center;">
        <div style="font-size: 28px; font-weight: 700; color: #f5f5f7; letter-spacing: -0.8px;">60 fps</div>
        <div style="font-size: 12px; font-weight: 500; color: #86868b; margin-top: 4px;">Real-Time 3D &amp; Canvas</div>
      </div>
      <div style="padding: 0 32px; border-left: 1px solid rgba(255,255,255,0.1); text-align: center;">
        <div style="font-size: 28px; font-weight: 700; color: #f5f5f7; letter-spacing: -0.8px;">0-Server</div>
        <div style="font-size: 12px; font-weight: 500; color: #86868b; margin-top: 4px;">Browser-Native AI</div>
      </div>
        </div>
      </div>
    
    </div>
  </foreignObject>
  
</svg>