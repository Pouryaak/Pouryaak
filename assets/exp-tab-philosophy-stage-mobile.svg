        width: 420px;
        height: 340px;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        position: relative;
      }
      .mono {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace;
      }
      
      .mph-list {
        width:100%; height:100%;
        display:flex; flex-direction:column; justify-content:space-between; gap:8px;
      }
    
    ]]></style>
    
  </defs>
  <rect width="420" height="340" fill="transparent"/>
