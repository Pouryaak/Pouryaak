        <div style="font-size:12px; color:#86868b; line-height:1.45; margin-top:4px;">Shipping UX improvements and architectural fixes to leading open-source AI app builders.</div>
      </div>
      <div style="background:#0d0d10; border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:14px 16px;">
